spring:
  application:
    name: newbeez-back
  cache:
    type: caffeine
    cache-names: participantCount
    caffeine:
      spec: expireAfterWrite=10s
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${NEWBEEZ_DB_URL}
    username: ${NEWBEEZ_DB_USERNAME}
    password: ${NEWBEEZ_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${NEWBEEZ_DDL_AUTO:validate}
    open-in-view: false
newbeez:
  cors:
    allowed-origins: ${NEWBEEZ_CORS_ALLOWED_ORIGINS}
